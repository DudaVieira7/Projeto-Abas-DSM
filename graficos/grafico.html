<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gráficos das minhas notas</title>
    <link rel="stylesheet" href="./grafico.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <h1>Minhas notas da faculdade em diferentes modelos de gráficos.</h1>

    <div class="grafico-container">
        <h2>Gráfico de colunas</h2>
        <canvas id="graficoColunas"></canvas>
    </div>

    <div class="grafico-container">
        <h2>Gráfico de barras</h2>
        <canvas id="graficoBarras"></canvas>
    </div>

    <div class="grafico-container">
        <h2>Gráfico de Pizza</h2>
        <canvas id="graficoPizza"></canvas>
    </div>

    <div class="grafico-container">
        <h2>Gráfico de Linha</h2>
        <canvas id="graficoLinha"></canvas>
    </div>

    <div class="grafico-container">
        <h2>Gráfico de Área</h2>
        <canvas id="graficoArea"></canvas>
    </div>
        

    <script src="./grafico.js"></script>
</body>
</html>
