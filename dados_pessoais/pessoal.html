<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Pessoa física</title>
    <link rel="stylesheet" href="./pessoal.css">
    
</head>
<body>
    <h1 style="text-align: center;"> Atividade de cadastro pessoa física -Maria Eduarda Moraes Vieira- 1° DSM</h1>
    <div class="container">
        <h2 style="color: rgb(52, 5, 73);">Cadastro de pessoa física</h2>
        <form>



            <!--Parte da identificação do usúario-->
            <div class="col-12">
                <label>Nome Completo<span class="required-star">*</span></label>
                <input type="text" name="nome" required placeholder="Carlos Alberto de Oliveira">
            </div>
            <div class="col-12">
                <label>Nome social</label>
                <input type="text" name="nome_social" placeholder="Beto Oliveira">
            </div>


            <div class="col-6">
                <label>Data de nascimento<span class="required-star">*</span></label>
                <input type="date" name="nascimento" required>
            </div>

            <div class="col-6">
                <label>Gênero<span class="required-star">*</span></label>
                <select name="sexo" required>
                    <option>Feminino</option>
                    <option>Masculino</option>
                    <option>Outro</option>
                </select>
            </div>



            <!--Filiação-->
            <div class="col-12">
                <label>Nome da Mãe<span class="required-star">*</span></label>
                <input type="text" name="mae" required placeholder="Anna Lúcia dos Santos">
            </div>

            <div class="col-12">
                <label>Nome do Pai </label>
                <input type="text" name="pai" placeholder="João Paulo de Oliveira">
            </div>



            <!--Documentação-->
            
            <div class="col-4">
                <label>CPF<span class="required-star">*</span></label>
                <input type="text" name="cpf" required placeholder="0123.345.678-90">
            </div>

            <div class="col-4">
                <label>RG<span class="required-star">*</span></label>
                <input type="text" name="rg" required placeholder="12.345.678-9">
            </div>

             <div class="col-4">
                <label>Órgão Emissor<span class="required-star">*</span></label>
                <input type="text" name="orgao" required placeholder="SSP/SP">
             </div> 

             <div class="col-6">
                <label>Nacionalidade</label>
                <input type="text" name="nacionalidade" required placeholder="Brasil">
             </div>

             <div class="col-6">
                <label>Naturalidade</label>
                <input type="text" name="naturalidade" required placeholder="São Paulo - SP">
             </div>
             <div class="col-12">
                <label>Título de Eleitor (opicional)</label>
                <input type="text" name="titulo" placeholder="1234 5678 9012">
             </div>


             <!--Endereço-->
             <div class="col-8">
                <label>Endereço<span class="required-star">*</span></label>
                <input type="text" name="endereco" required placeholder="Rua das Flores">
             </div>
             <div class="col-2">
                <label>Número<span class="required-star">*</span></label>
                <input type="text" name="numero" required placeholder="123A">
             </div>
             <div class="col-2">
                <label>Complemento</label>
                <input type="text" name="Complemento" placeholder="Apartamento 51">
             </div>


             <div class="col-4">
                <label>Bairro<span class="required-star">*</span></label>
                <input type="text" name="bairro" required placeholder="Vila Nova">
             </div>
             <div class="col-4">
                <label>Cidade<span class="required-star">*</span></label>
                <input type="text" name="ciadade" required placeholder="Campinas">
             </div>
             <div class="col-2">
                <label>Estado<span class="required-star">*</span></label>
                <select name="estado" required>
                    <option value="">Selecione</option>
                    <!--estados da região suldeste do Brasil-->
                    <option>SP</option>
                    <option>RJ</option>
                    <option>MG</option>
                    <option>ES-</option>
                    <!--estados da região sul do Brasil-->
                    <option>PR</option>
                    <option>RS</option>
                    <option>SC</option>
                    <!--estados da região norte do Brasil-->
                    <option>AC</option>
                    <option>AM</option>
                    <option>AP</option>
                    <option>PA</option>
                    <option>RO</option>
                    <option>RR</option>
                    <option>TO</option>
                    <!--estados da região centro-oste do Brasil-->
                    <option>DF</option>
                    <option>GO</option>
                    <option>MS</option>
                    <option>MT</option>
                    <!--estados da região nordeste do Brasil-->
                    <option>AL</option>
                    <option>BA</option>
                    <option>CE</option>
                    <option>MA</option>
                    <option>PB</option>
                    <option>PE</option>
                    <option>PI</option>
                    <option>RN</option>
                    <option>SE</option>
                </select>
             </div>
             <div class="col-2">
                <label>CEP<span class="required-star">*</span></label>
                <input type="text" name="cep" required placeholder="13000-000">
             </div>


             <!--parte dos contatos-->
             <div class="col-6">
                <label>Celular<span class="required-star">*</span></label>
                <input type="tel" name="celular" required placeholder="(19) 98765-4321">
             </div>
             <div class="col-6">
                <label>Telefone Residencial</label>
                <input type="tel" name="telefone" placeholder="(19) 3456-7890">
             </div>
             <div class="col-12">
                <label>E-mail<span class="required-star">*</span></label>
                <input type="email" name="email" required placeholder="carlos.oliveira@exemplo.com">
             </div>

             <!-- Situação atual-->
              <div class="col-6">
                <label>Ocupação</label>
                <input type="text" name="ocupacao" placeholder="Desenvolvedor Web Júnior">
              </div>
              <div class="col-6">
                <label>Grau de Instituição<span class="required-star">*</span></label>
                <select name="instituicao" required>
                    <option value="">Selecione</option>
                    <option>Ensino Fundamental</option>
                    <option>Ensino Médio</opition>
                    <option>Educação Superior</option>
                    <option>Pós- graduação</option>
                    <option>Mestrado</option>
                    <option>Doutorado</option>
                </select>
              </div>



              <!--Parte dos botões-->
              <div class="buttons">
                <button type="reset" class="btn-segundary"> Limpar</button>
                <button type="submit" class="btn-primary"> Salvar</button>
              </div>



        </form>
    </div>

    
</body>
</html>
